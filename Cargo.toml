[package]
name = "spatie-ssl-certificate"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
authors = ["Spatie <info@spatie.be>"]
description = "Read and validate SSL certificates"
license = "MIT"
repository = "https://github.com/spatie/ssl-certificate-rust"
documentation = "https://spatie.be/docs/ssl-certificate-rust/v1/introduction"
readme = "README.md"
keywords = ["spatie", "ssl", "tls", "certificate", "x509"]
categories = ["network-programming", "cryptography"]
include = ["/src/", "/tests/", "/build.rs", "/docs/", "/README.md", "/LICENSE.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/SECURITY.md", "/Cargo.lock"]

[dependencies]
base64 = "0.22"
md-5 = "0.10"
num-bigint = "0.4"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
time = { version = "0.3", features = ["serde"] }
url = "2"
x509-parser = "0.18"

[dev-dependencies]
rcgen = "0.14"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"

[profile.release]
lto = "thin"
strip = true
